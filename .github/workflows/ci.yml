# CI：PR と main への push で go test / vitest / lint を実行する。
# docs/03-guardrails.md「テスト通過必須」。ジョブ名（go / web）は Branch protection の
# required status checks から参照されるため、変更時は protection 側も更新する。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crawler
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          # 標準ライブラリのみで go.sum が無いため無効化。依存が増えたら
          # cache-dependency-path: crawler/go.sum を指定して有効にする
          cache: false

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: build
        run: npm run build

  # supabase/migrations に変更がある PR だけ、本番 DB に対して dry-run を行い、
  # 適用予定の SQL を PR コメントに出す。drop / alter ... type / truncate を含む場合は
  # destructive-migration ラベルを付け、自動マージの対象外にする（docs/03-guardrails.md）。
  # 実際の適用は main マージ後の deploy.yml。fork からの PR は Secrets を持たないので対象外
  supabase-dry-run:
    name: supabase dry-run
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: migrations の変更を検出
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' \
            | grep -E '^supabase/(migrations/.*\.sql|config\.toml)$' || true)"
          if [ -n "$files" ]; then
            echo "変更あり:"
            echo "$files"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "supabase/migrations に変更なし。dry-run は行わない"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changed.outputs.changed == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0 # deploy.yml と揃える

      - name: supabase db push --dry-run
        if: steps.changed.outputs.changed == 'true'
        id: dryrun
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: .github/scripts/supabase-dry-run.sh tbvzseiehzuobglwbedo "$RUNNER_TEMP/supabase-dry-run"

      # dry-run が失敗しても、その内容をコメントで見せる（always）
      - name: PR にコメントとラベルを付ける
        if: always() && steps.changed.outputs.changed == 'true'
        uses: actions/github-script@v9
        env:
          COMMENT_FILE: ${{ runner.temp }}/supabase-dry-run/comment.md
          DESTRUCTIVE: ${{ steps.dryrun.outputs.destructive }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- supabase-migration-dry-run -->';
            const label = 'destructive-migration';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            if (!fs.existsSync(process.env.COMMENT_FILE)) {
              core.warning('comment.md が無いためコメントしない（dry-run の前段で失敗）');
              return;
            }
            const body = fs.readFileSync(process.env.COMMENT_FILE, 'utf8');

            // 同じ PR に既にコメントがあれば更新し、push ごとに増やさない
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

            // ラベルは付けるだけ。外すのはオーナー（CI が付けたか人が付けたか区別できないため）
            if (process.env.DESTRUCTIVE === 'true') {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({
                  owner, repo, name: label, color: 'B60205',
                  description: '破壊的な DB マイグレーションを含む PR。自動マージ対象外、オーナー承認必須（docs/03-guardrails.md）',
                });
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
              core.notice(`${label} ラベルを付けました`);
            }
