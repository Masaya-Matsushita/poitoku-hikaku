# 日次レポート：crawl_logs から reports/YYYY-MM-DD.md を生成し、PR を作って自動マージする。
# 通常は crawl.yml のクロール完了後に呼ばれる（workflow_call）。手動で作り直す時は workflow_dispatch。
#
# reports/** は自動マージしてよい範囲（AGENTS.md）。main への直 push はせず PR 経由にする。
# 必須チェック（go / web）の満たし方：bot（GITHUB_TOKEN）が作った PR の pull_request 実行は
# 「初回貢献者」扱いで承認待ち（action_required）になることがある（2026-09-24 に発生）。承認待ちなら API で
# 承認する。pull_request 実行が作られない場合は ci.yml を workflow_dispatch で明示的に起動する。
# その後は gh pr merge --auto に任せる。
# 自動マージの判定（automerge.yml、ADR-0006）と同じ commit status「auto-merge-gate」も自分で付ける。
# reports/** だけの PR は常に条件を満たし、bot が起動した CI の完了で automerge.yml が動く保証がないため。
name: Report

on:
  workflow_call:
    inputs:
      date:
        description: '対象日 YYYY-MM-DD（JST）。空なら今日'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      date:
        description: '対象日 YYYY-MM-DD（JST）。空なら今日'
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  report:
    name: report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache-dependency-path: crawler/go.sum

      - name: 生成
        id: gen
        working-directory: crawler
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          date="$INPUT_DATE"
          if [ -z "$date" ]; then date="$(TZ=Asia/Tokyo date +%F)"; fi
          go run ./cmd/report -date "$date" -out "../reports/$date.md"
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: PR を作って自動マージ
        env:
          DATE: ${{ steps.gen.outputs.date }}
        run: |
          file="reports/$DATE.md"
          if git diff --quiet -- "$file" && [ -z "$(git status --porcelain -- "$file")" ]; then
            echo "$file に変更なし。PR は作らない"
            exit 0
          fi
          branch="report/$DATE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add "$file"
          git commit -m "report: $DATE の日次レポート"
          git push --force origin "$branch"

          pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$branch" \
              --title "report: $DATE" \
              --body "$(printf '%s\n' "crawl.yml の report ジョブが生成した日次レポート。判定と要確認の項目はファイル先頭。" "" "reports/** は自動マージの範囲（AGENTS.md）。CI 通過後に自動でマージされる。")"
            pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          fi

          # 必須チェック（go / web）を満たす。PR 作成直後に pull_request 実行が作られるので少し待つ
          sleep 15
          sha="$(git rev-parse HEAD)"
          runs="$(gh run list --workflow ci.yml --event pull_request --commit "$sha" --json databaseId,conclusion --jq '.[] | "\(.databaseId) \(.conclusion)"')"
          if [ -z "$runs" ]; then
            echo "pull_request の CI 実行が無いので明示的に起動する"
            gh workflow run ci.yml --ref "$branch"
          else
            # 承認待ち（action_required）の実行は承認する。GITHUB_TOKEN で承認できない場合は明示起動に切り替える
            echo "$runs" | while read -r run_id conclusion; do
              if [ "$conclusion" = "action_required" ]; then
                if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve" >/dev/null; then
                  echo "承認待ちの CI 実行 $run_id を承認した"
                else
                  echo "CI 実行 $run_id を承認できなかった。明示的に起動する"
                  gh workflow run ci.yml --ref "$branch"
                fi
              else
                echo "pull_request の CI 実行 $run_id は承認不要（$conclusion）"
              fi
            done
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
            -f state=success -f context=auto-merge-gate \
            -f description="report.yml が生成した reports/** だけの PR" >/dev/null
          gh pr merge "$pr" --auto --squash --delete-branch
          echo "PR #$pr を作成し、CI 通過後の自動マージを予約した"
