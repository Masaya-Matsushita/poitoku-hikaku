# 日次クロール：毎日 03:00 JST に各サイトの案件を収集して Supabase に書く。
# docs/03-guardrails.md「1日1回」。cron は 1 本だけにする（crawler/internal/policy のテストが検証する）。
# workflow_dispatch はオーナーの手動確認用。dry_run を付けると DB に書かない。
name: Crawl

on:
  schedule:
    - cron: '0 18 * * *' # 03:00 JST（UTC+9）
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DB に書き込まず、取得と抽出だけ行う'
        type: boolean
        default: false

permissions:
  contents: read

# 同時に 2 本走らせない（対象サイトへの負荷を増やさない）。進行中があれば待たせる
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  # サイトごとに別ジョブ（別ランナー）で並列に走る。対象サイトが違うので相互に負荷はかからず、
  # 各ジョブ内では policy の 3 秒間隔を守る。1 サイトが失敗しても他は続ける
  crawl:
    name: ${{ matrix.site }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        site: [moppy, hapitas]
    defaults:
      run:
        working-directory: crawler
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache-dependency-path: crawler/go.sum

      - name: crawl
        run: go run ./cmd/crawler -site ${{ matrix.site }} ${{ inputs.dry_run == true && '-dry-run' || '' }}

  # クロール後に日次レポート（reports/YYYY-MM-DD.md）を生成し PR → 自動マージ。
  # 失敗した日こそレポートが要るので always()。dry_run の時は DB に書いていないので作らない
  report:
    needs: crawl
    if: always() && inputs.dry_run != true
    uses: ./.github/workflows/report.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      actions: write
