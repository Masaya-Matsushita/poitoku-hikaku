# 本番デプロイ：main への push 時のみ。
#   1. supabase db push で未適用のマイグレーションを本番 DB に適用
#   2. その後 web/ をビルドして Firebase Hosting（live チャンネル）へ配信
# docs/03-guardrails.md「本番デプロイは main からのみ」。手動起動（workflow_dispatch）は
# 意図的に付けていない。プレビューチャンネルも使わない（Secrets を PR に露出させない）。
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# デプロイは並列させない。進行中のものは取り消さず、後続を待たせる
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # PR の dry-run（ci.yml）と同じ接続・同じフラグで適用する。適用済みなら "up to date" で何もしない。
  # 失敗したら hosting は動かない（スキーマが古いままフロントだけ更新しないため）。
  # 接続は --db-url でセッションプーラー（IPv4）へ直接つなぐ。Management API（アクセストークン）は使わない：
  # ランナーは IPv6 を持たず直接接続できず、link はスコープ付きトークンでは通らない（api-keys の閲覧が要る）ため
  supabase:
    name: supabase db push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Dashboard → Connect → Session pooler と同じ値。リージョンや ref が変わったらここを直す
      SUPABASE_DB_USER: postgres.tbvzseiehzuobglwbedo
      SUPABASE_DB_HOST: aws-0-ap-northeast-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0 # ci.yml と揃える

      - name: 接続文字列を組み立てる
        run: |
          # パスワードは URL 用に percent-encode し、その形もログからマスクする
          enc="$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p | @uri')"
          echo "::add-mask::$enc"
          echo "SUPABASE_DB_URL=postgresql://${SUPABASE_DB_USER}:${enc}@${SUPABASE_DB_HOST}:5432/postgres" >> "$GITHUB_ENV"

      - name: 適用予定を表示
        run: supabase db push --dry-run --include-all --db-url "$SUPABASE_DB_URL" --yes

      - name: 適用
        run: supabase db push --include-all --db-url "$SUPABASE_DB_URL" --yes

  hosting:
    name: firebase hosting
    needs: supabase
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://poitoku-hikaku.web.app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: poitoku-hikaku
          channelId: live
